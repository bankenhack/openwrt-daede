name: Build daed (custom dark WebUI)

# Manually build `daed` (with the custom dark-dashboard WebUI baked in, via
# daed/Makefile + daed/custom-web/ committed in this fork) for one router
# architecture, using kenzok8/openwrt-daede's own proven build recipe
# (mirrors their .github/workflows/release.yml build job almost line for
# line - see that file in the upstream repo for the full multi-arch matrix
# this is derived from).
#
# This does NOT publish anything - it just builds and attaches the .ipk/.apk
# as a downloadable GitHub Actions artifact for you to grab and opkg/apk
# install manually.
#
# Want more than one architecture in a single run? GitHub Actions has no
# string-split expression function, so a comma-separated input can't be
# turned into a matrix without an extra job just to parse it. Simplest is
# just re-running this workflow once per architecture you need.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要编译的包(空格分隔)'
        default: 'daed luci-app-daede'
      arch:
        description: '目标架构(照抄 openwrt-daede release.yml 里用的名字,例如 x86_64 / aarch64_generic / aarch64_cortex-a53)'
        default: 'aarch64_cortex-a53'
      sdk:
        description: 'OpenWrt/ImmortalWrt 版本'
        default: '25.12'

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.arch }} · SDK ${{ inputs.sdk }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Heavy dae/daed + Go toolchain builds can exhaust the runner's default
      # disk space - this is copied straight from kenzok8's own release.yml,
      # which added it after hitting real "No space left on device" failures.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/.ghcup 2>/dev/null || true
          sudo docker image prune -af || true
          df -h /

      - name: Build packages
        uses: kenzok8/gh-action-sdk@main
        env:
          CONTAINER: openwrt/sdk
          ARCH: ${{ inputs.arch }}-openwrt-${{ inputs.sdk }}
          FEEDNAME: daede
          PACKAGES: ${{ inputs.packages }}
          # wall supplies v2ray-geoip / v2ray-geosite (subpackages of v2ray-geodata)
          EXTRA_FEEDS: src-git|wall|https://github.com/kenzok8/wall
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: false
          INDEX: 0
          KEY_BUILD: ${{ secrets.OPKG_KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          # dae / daed go.mod requires Go 1.26; override SDK's bundled golang.
          # (copied from kenzok8/openwrt-daede's own release.yml - their SDK's
          # stock golang feed package doesn't support 1.26 / the GOEXPERIMENT
          # flags daed's Makefile needs yet)
          GOLANG_REPO: https://github.com/kenzok8/golang
          GOLANG_BRANCH: '1.26'

      # FEED_DIR is deliberately just bin/packages/<arch>/daede - NOT
      # <arch>-openwrt-<sdk> (that longer form is only the docker image tag
      # used above to pick the right SDK container). Confirmed against
      # kenzok8/openwrt-daede's own release.yml "Collect packages" step,
      # which uses this exact same bare-arch path.
      - name: Collect packages
        if: always()
        run: |
          ARCH="${{ inputs.arch }}"
          mkdir -p dist
          FEED_DIR="bin/packages/${ARCH}/daede"
          echo "Looking in $FEED_DIR"
          ls -la "$FEED_DIR" 2>/dev/null || echo "(directory doesn't exist - build likely failed, check the 'Build packages' step log above)"

          for f in "$FEED_DIR"/*.ipk; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in Packages*) continue ;; esac
            cp -v "$f" dist/
          done

          for f in "$FEED_DIR"/*.apk; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in Packages*|APKINDEX*|packages.adb*) continue ;; esac
            cp -v "$f" dist/
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: daed-custom-webui-${{ inputs.arch }}-sdk${{ inputs.sdk }}
          path: dist/
          if-no-files-found: warn
